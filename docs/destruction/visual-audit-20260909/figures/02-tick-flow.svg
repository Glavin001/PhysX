<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img"><title>2. One tick: trial, fracture, one correction, final acceptance</title><desc>Conceptual order, not time-scaled. Timings are from A; current publication placement is identified explicitly.</desc><rect width="100%" height="100%" fill="white"/>
