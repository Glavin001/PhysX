<text x="373" y="833" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#182A3A">Accept once; publish final properties and events</text>
<text x="373" y="864" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Current public properties/shape owners publish after both verdicts</text>
<text x="40" y="963" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#182A3A">No fracture after trial: skip ownership mutation / correction; still complete required material and acceptance work.</text>
<text x="40" y="1005" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#B84042">Target: GPU allocation + registration + contacts -&gt; device condition -&gt; correction -&gt; one CPU accepted observation.</text>
<text x="40" y="1041" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#182A3A">GPU preparation already precedes CPU construction; CPU registration is still required before corrected physics.</text>
