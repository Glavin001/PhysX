<text x="988" y="148" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#182A3A">Stress components</text>
<text x="988" y="179" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Connected unknowns in equations</text>
<text x="988" y="204" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Fixed supports are boundaries</text>
<text x="988" y="229" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Different partition from motion</text>
<text x="988" y="254" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">B: 1,030 trial / 1,793 corrected</text>
