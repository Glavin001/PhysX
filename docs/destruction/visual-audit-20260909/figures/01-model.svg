<text x="58" y="179" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">113,664 authored chunks</text>
<text x="58" y="204" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">229,376 authored bonds</text>
<text x="58" y="229" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Geometry identity survives splitting</text>
<text x="58" y="254" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Chunks are not independent motions</text>
<rect x="505" y="115" width="425" height="180" fill="#F6F8FB" stroke="#F6F8FB"/>
<rect x="505" y="115" width="7" height="180" fill="#147D64" stroke="#147D64"/>
<text x="523" y="148" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#182A3A">Rigid motion clusters</text>
<text x="523" y="179" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Initially 256 building clusters</text>
<text x="523" y="204" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Tick 48: 10,705 logical clusters</text>
<text x="523" y="229" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">10,449 reported fragment bodies</text>
<text x="523" y="254" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">10,193 awake fragment bodies</text>
