<rect x="40" y="365" width="7" height="155" fill="#AD6800" stroke="#AD6800"/>
<text x="58" y="398" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#182A3A">Contact / constraint dependencies</text>
<text x="58" y="429" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Projectile &lt;-&gt; wall &lt;-&gt; debris &lt;-&gt; ordinary actor / joint</text>
<text x="58" y="454" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Can connect several separate stress components</text>
<text x="58" y="479" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Needed for a correct selective rewind and replay</text>
<rect x="730" y="365" width="665" height="155" fill="#F6F8FB" stroke="#F6F8FB"/>
<rect x="730" y="365" width="7" height="155" fill="#B84042" stroke="#B84042"/>
<text x="748" y="398" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#182A3A">Why the distinction matters</text>
<text x="748" y="429" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Sleeping is a motion state, not proof of unchanged stress</text>
<text x="748" y="454" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">One shared floor must not merge the entire stress world</text>
<text x="748" y="479" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Current full correction remains; selective closure is TODO</text>
<text x="40" y="592" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#182A3A">A body count does not measure sparse stress work. A bond count does not measure collision work.</text>
<text x="40" y="642" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#182A3A">Colors: green retain | amber optimize | red replace/migrate | gray unresolved scope | blue GPU timing</text>
</svg>