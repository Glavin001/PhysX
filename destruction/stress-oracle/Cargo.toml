[workspace]
resolver = "2"
members = ["crates/stress-ref", "crates/stress-physx", "crates/stress-viz"]
# stress-physx links the PhysX SDK (needs PHYSX_ROOT); build it explicitly with -p.
# stress-viz (debug renderer, needs ffmpeg at run time) is built explicitly with -p too.
default-members = ["crates/stress-ref"]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
publish = false

[profile.release]
debug = 1

# Tests are numerical: run them optimized so the explicit reference stays fast.
[profile.test]
opt-level = 3
debug-assertions = true
