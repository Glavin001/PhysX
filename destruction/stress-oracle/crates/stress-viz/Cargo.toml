[package]
name = "stress-viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Debug renderer and video tool for the reference destruction stress solver (software rasterizer, ffmpeg output)"

[[bin]]
name = "stress-viz"
path = "src/main.rs"

[features]
# PhysX CPU as the rigid-body engine (`--engine physx`, variant item `engine physx`);
# needs PHYSX_ROOT, see the README.
physx = ["dep:stress-physx"]

[dependencies]
stress-ref = { path = "../stress-ref" }
stress-physx = { path = "../stress-physx", optional = true }
